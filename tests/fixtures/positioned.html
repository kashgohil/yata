<!doctype html>
<style>
  * { margin: 0 }
  .card { position: relative; width: 40em; padding: 1em; border: 1px solid }
  .close { position: absolute; top: 0; right: 0; width: 2em }
  .badge { position: relative; left: 1em; top: 1em }
  .panel { position: absolute; top: 3em; left: 1em; padding: 1em; border: 1px solid }
</style>
<article class="card">
  <a class="close" href="#close">close</a>
  <p>Normal-flow prose keeps its ordinary place.</p>
  <p><a class="badge" href="#badge">relative badge</a> keeps its flow space.</p>
  <section class="panel"><a href="#panel">absolute panel link</a></section>
</article>
