<!doctype html>
<html><head><style>
body { margin: 0 }
.col { display: flex; flex-direction: column }
.gapped { gap: 1em 4em }
.grow div { flex: 1 }
.pad { padding: 1em 2em }
</style></head>
<body>
<div class="col"><div>one</div><div>two three four five six</div><div>seven</div></div>
<div class="col gapped"><div>a</div><div>b</div><div>c</div></div>
<div class="col grow"><div>x</div><div>y</div></div>
<div class="col pad"><div>p</div><div>q</div></div>
</body></html>
