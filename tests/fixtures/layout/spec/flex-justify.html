<!doctype html>
<html><head><style>
body { margin: 0 }
.row { display: flex }
.row div { flex: 0 0 160px }
.start { justify-content: flex-start }
.end { justify-content: flex-end }
.mid { justify-content: center }
.between { justify-content: space-between }
.around { justify-content: space-around }
.evenly { justify-content: space-evenly }
</style></head>
<body>
<div class="row start"><div>a</div><div>b</div><div>c</div></div>
<div class="row end"><div>a</div><div>b</div><div>c</div></div>
<div class="row mid"><div>a</div><div>b</div><div>c</div></div>
<div class="row between"><div>a</div><div>b</div><div>c</div></div>
<div class="row around"><div>a</div><div>b</div><div>c</div></div>
<div class="row evenly"><div>a</div><div>b</div><div>c</div></div>
</body></html>
