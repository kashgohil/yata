<!doctype html>
<html><head><style>

.wide div { flex: 0 0 800px }
</style></head>
<body>
<div class="row"><div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div></div>

<div class="row grow"><div>a</div><div>b</div><div>c</div><div>d</div><div>e</div></div>
<div class="row wide"><div>a</div><div>b</div></div>
</body></html>
