<!doctype html>
<html><head><style>
body { margin: 0 }
.row { display: flex; gap: 10% }
.tight { gap: 1em }
.row div { flex: 0 0 160px }
.between { justify-content: space-between }
.mid { justify-content: center }
</style></head>
<body>
<div class="row"><div>a</div><div>b</div><div>c</div></div>
<div class="row between"><div>a</div><div>b</div><div>c</div></div>
<div class="row mid"><div>a</div><div>b</div><div>c</div></div>
<div class="row tight"><div>a</div><div>b</div><div>c</div></div>
</body></html>
