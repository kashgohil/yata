<!doctype html>
<html><head><style>
body { margin: 0 }
.row { display: flex; flex-direction: row-reverse }
.row div { flex: 0 0 160px }
.between { justify-content: space-between }
.gap { gap: 1em }
</style></head>
<body>
<div class="row"><div>a</div><div>b</div><div>c</div></div>
<div class="row between"><div>a</div><div>b</div><div>c</div></div>
<div class="row gap"><div>a</div><div>b</div><div>c</div></div>
</body></html>
