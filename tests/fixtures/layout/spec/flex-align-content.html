<!doctype html>
<html><head><style>
body { margin: 0 }
.wrap { display: flex; flex-wrap: wrap; height: 6em }
.wrap div { flex: 0 0 400px }
.start { align-content: flex-start }
.end { align-content: flex-end }
.mid { align-content: center }
.between { align-content: space-between }
.around { align-content: space-around }
.stretch { align-content: stretch }
</style></head>
<body>
<div class="wrap start"><div>a</div><div>b</div></div>
<div class="wrap end"><div>a</div><div>b</div></div>
<div class="wrap mid"><div>a</div><div>b</div></div>
<div class="wrap between"><div>a</div><div>b</div></div>
<div class="wrap around"><div>a</div><div>b</div></div>
<div class="wrap stretch"><div>a</div><div>b</div></div>
</body></html>
