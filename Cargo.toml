[package]
name = "yata"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13.4", features = ["blocking", "gzip"] }
rquickjs = "0.12"
unicode-width = "0.2"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "scroll"
harness = false

[[bench]]
name = "style"
harness = false

[[bench]]
name = "layout"
harness = false
